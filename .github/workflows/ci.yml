name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    name: Node (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: contable
          POSTGRES_PASSWORD: contable
          POSTGRES_DB: contable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U contable"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      minio:
        # minio/minio was removed from Docker Hub (404); use the public, pinned Silo release.
        image: docker.io/pgsty/silo:RELEASE.2026-10-18T00-00-00Z
        env:
          MINIO_ROOT_USER: contable
          MINIO_ROOT_PASSWORD: contable-minio
        command: server /data --console-address ":9001"
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      clamav:
        image: clamav/clamav-debian:stable
        ports:
          - 3310:3310
        options: >-
          --health-cmd "clamdscan --ping 1"
          --health-interval 30s
          --health-timeout 10s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://contable:contable@localhost:5432/contable
      RUNTIME_DATABASE_URL: postgresql://contable_runtime:runtime_secret@localhost:5432/contable
      # Base desechable para las pruebas de integración de recuperación de
      # acceso (member-access-recovery.integration.test.ts): apunta a la misma
      # DB efímera de CI. Sin la variable, la suite se omite (nunca corre
      # contra una base que no sea desechable).
      RECOVERY_IT_DATABASE_URL: postgresql://contable:contable@localhost:5432/contable
      SHADOW_DATABASE_URL: postgresql://contable:contable@localhost:5432/contable_shadow
      REDIS_URL: redis://localhost:6379
      MINIO_ENDPOINT: localhost
      MINIO_PORT: "9000"
      MINIO_SECRET_KEY: contable-minio
      CLAMAV_HOST: localhost
      CLAMAV_PORT: "3310"
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate Prisma client
        run: npm exec --workspace @contable/api -- prisma generate --config prisma.config.ts

      - name: Build internal packages
        run: npm run build -w @contable/contracts -w @contable/accounting-engine -w @contable/permissions -w @contable/storage -w @contable/tax-engine

      - name: Setup PostgreSQL roles and shadow DB
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE contable_runtime LOGIN PASSWORD 'runtime_secret' NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
          CREATE ROLE contable_worker LOGIN PASSWORD 'worker_secret' NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
          CREATE DATABASE contable_shadow;
          GRANT CONNECT ON DATABASE contable TO contable_runtime, contable_worker;
          GRANT USAGE ON SCHEMA public TO contable_runtime, contable_worker;
          SQL

      - name: Apply migrations
        run: npm run migrate:deploy -w @contable/api

      - name: Apply RLS and seed
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f apps/api/prisma/rls.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f apps/api/prisma/seed-fase2.sql

      - name: Seed E2E fixtures
        run: |
          npm run seed:demo -w @contable/api
          npm run seed:maestros-fiscales -w @contable/api
          npm run seed:piloto -w @contable/api

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        # Sin --with-deps: la imagen ubuntu-latest ya trae todas las
        # bibliotecas de sistema que Chromium usa en tiempo de ejecución.
        # --with-deps solo sumaba paquetes de fuentes (fonts-*/xfonts-*) vía
        # apt, y una falla de DNS de archive.ubuntu.com tumbaba el job.
        run: npx playwright install chromium

      - name: Start and wait for document worker
        run: |
          worker_log="$RUNNER_TEMP/contable-worker.log"
          nohup npm run start -w @contable/worker > "$worker_log" 2>&1 < /dev/null &
          worker_pid=$!
          echo "$worker_pid" > "$RUNNER_TEMP/contable-worker.pid"
          if ! node e2e/wait-for-document-worker.mjs; then
            cat "$worker_log"
            kill "$worker_pid" 2>/dev/null || true
            exit 1
          fi
          if ! kill -0 "$worker_pid" 2>/dev/null; then
            cat "$worker_log"
            echo "Document worker exited after readiness check"
            exit 1
          fi

      - name: Stub de readiness del servicio de IA (solo E2E)
        # Stub de prueba para la readiness del servicio de IA; no valida funciones de IA.
        run: |
          nohup node -e "require('http').createServer((q,s)=>{if(q.url==='/health/ready'){s.writeHead(200);s.end('ok')}else{s.writeHead(404);s.end()}}).listen(8000)" > /tmp/ai-readiness-stub.log 2>&1 &
          for i in $(seq 1 20); do
            curl -fsS http://localhost:8000/health/ready && exit 0
            sleep 1
          done
          cat /tmp/ai-readiness-stub.log
          exit 1

      - name: E2E (Playwright)
        run: npm run test:e2e
        env:
          E2E_WEB_URL: http://127.0.0.1:4173
          AI_SERVICE_URL: http://localhost:8000
          AI_SERVICE_SECRET: dev-secret
          MFA_CHALLENGE_SECRET: e2e-mfa-challenge-secret-with-32-characters

  python:
    name: Python (lint, typecheck, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Typecheck (mypy)
        run: mypy -p app

      - name: Test (pytest)
        run: pytest