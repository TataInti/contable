/* Tokens: copia literal de packages/design-system/src/tokens.css */
:root{
  color-scheme:light;
  --ds-color-background:#faf8f4;--ds-color-surface:#fffdf8;--ds-color-surface-muted:#f1eee6;--ds-color-surface-hover:#f6f3ec;--ds-color-surface-pressed:#ebe6dc;
  --ds-color-text:#22211d;--ds-color-text-muted:#625f57;--ds-color-text-faint:#756f65;
  --ds-color-border:#d8d2c7;--ds-color-border-subtle:#e7e2d9;--ds-color-border-strong:#aaa398;
  --ds-color-focus:#256247;--ds-color-focus-subtle:#c9dfd3;
  --ds-color-primary:#256247;--ds-color-primary-hover:#1f523c;--ds-color-primary-active:#183f2f;--ds-color-on-primary:#fffdf8;
  --ds-color-danger:#a9362a;--ds-color-danger-subtle:#f4d8d3;
  --ds-color-warning:#8a570e;--ds-color-warning-subtle:#f8ead3;
  --ds-color-success:#256247;--ds-color-success-subtle:#e5efe9;
  --ds-color-info:#285d83;--ds-color-info-subtle:#e3edf4;
  --ds-color-selected:#e2eee7;--ds-color-primary-soft:#e2eee7;
  --ds-space-1:4px;--ds-space-2:8px;--ds-space-3:12px;--ds-space-4:16px;--ds-space-5:20px;--ds-space-6:24px;
  --ds-font-sans:"Source Sans 3",system-ui,-apple-system,sans-serif;--ds-font-serif:"Source Serif 4",Georgia,serif;
  --ds-text-xs:12px;--ds-text-sm:13px;--ds-text-base:14px;--ds-text-lg:16px;--ds-text-xl:20px;--ds-text-2xl:24px;
  --ds-radius-sm:3px;--ds-radius-md:5px;--ds-radius-lg:8px;
  --ds-shadow-control:0 1px 2px rgba(34,33,29,.07);--ds-shadow-float:0 8px 24px rgba(34,33,29,.14);--ds-shadow-popover:0 4px 12px rgba(34,33,29,.12);
  --rh:32px; /* altura de fila: 28 / 32 / 40 */
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--ds-font-sans);font-size:var(--ds-text-base);color:var(--ds-color-text);background:var(--ds-color-background);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--ds-font-serif);font-weight:600;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ds-color-focus);outline-offset:2px}
.ic{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mut{color:var(--ds-color-text-muted)} .faint{color:var(--ds-color-text-faint)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ───────── Shell (barra lateral sin cambios) ───────── */
.app{display:flex;height:100vh;min-width:1100px}
.sb{width:264px;flex:0 0 264px;display:flex;flex-direction:column;background:var(--ds-color-surface);border-right:1px solid var(--ds-color-border)}
.brand{display:flex;align-items:center;gap:12px;min-height:82px;padding:16px 20px;border-bottom:1px solid color-mix(in srgb,var(--ds-color-border) 72%,transparent)}
.mark{display:grid;place-items:center;width:40px;height:40px;border-radius:12px 12px 12px 3px;background:var(--ds-color-primary);color:var(--ds-color-surface);font:700 23px/1 var(--ds-font-serif)}
.brand b{display:block;font:650 21px/1.05 var(--ds-font-serif);letter-spacing:-.02em}
.brand small{font-size:12px;color:var(--ds-color-text-muted)}
.nav{flex:1;min-height:0;overflow:auto;padding:16px 12px;scrollbar-width:thin}
.grp+.grp{margin-top:14px}
.navcfg{flex:none;padding:12px 12px 8px;border-top:1px solid var(--ds-color-border)}
.lbl{margin:0 0 6px;padding:0 12px;color:var(--ds-color-text-faint);font-size:10px;font-weight:700;letter-spacing:.115em;text-transform:uppercase}
.nl{position:relative;display:grid;grid-template-columns:20px 1fr;align-items:center;gap:12px;min-height:38px;margin:2px 0;padding:6px 12px;border-radius:var(--ds-radius-lg);color:var(--ds-color-text-muted);font-size:14px;font-weight:550;text-decoration:none;cursor:default;border:0;background:none;width:100%;text-align:left}
.nl[data-page]{cursor:pointer}
.nl[data-page]:hover{background:var(--ds-color-surface-muted);color:var(--ds-color-text)}
.nl.on{background:var(--ds-color-primary-soft);color:var(--ds-color-primary);font-weight:700}
.nl.on::before{content:"";position:absolute;left:-12px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--ds-color-primary)}
.sbf{padding:12px;border-top:1px solid var(--ds-color-border)}
.tour{display:grid;grid-template-columns:30px 1fr;align-items:center;gap:10px;margin-bottom:6px;padding:8px 10px;border:1px solid color-mix(in srgb,var(--ds-color-primary) 26%,var(--ds-color-border));border-radius:var(--ds-radius-lg);background:var(--ds-color-primary-soft);font-size:13px}
.tour i{display:grid;place-items:center;width:28px;height:28px;border:1px solid color-mix(in srgb,var(--ds-color-primary) 35%,transparent);border-radius:50%;color:var(--ds-color-primary);font:700 15px var(--ds-font-serif);font-style:normal}
.tour small{display:block;color:var(--ds-color-text-muted);font-size:12px}
.me{display:flex;align-items:center;gap:10px;padding:6px 8px;font-size:13px}
.me .av{width:28px;height:28px;font-size:12px}
.main{flex:1;min-width:0;display:flex;flex-direction:column;height:100vh}
.ctx{display:flex;align-items:center;gap:28px;height:52px;flex:none;padding:0 24px;background:var(--ds-color-surface);border-bottom:1px solid var(--ds-color-border)}
.ctx div{display:grid;gap:1px;font-size:12px;color:var(--ds-color-text-muted);line-height:1.2}
.ctx div b{font-size:13px;color:var(--ds-color-text);font-weight:600}
.ctx .sp{flex:1}

/* ───────── Página ───────── */
.page{flex:1;min-height:0;display:flex;flex-direction:column;padding:14px 24px 0;overflow:hidden}
.ph{display:flex;align-items:flex-end;gap:20px;margin-bottom:10px}
.ph .t{flex:none}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ds-color-primary)}
.ph h1{font-size:26px;line-height:1.15;letter-spacing:-.01em}
.ph p{flex:1;margin:0 0 3px;max-width:560px;font-size:13px;line-height:1.4;color:var(--ds-color-text-muted)}
.ph .acts{margin-left:auto;display:flex;gap:8px;align-items:center}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border:1px solid var(--ds-color-border-strong);border-radius:var(--ds-radius-md);background:var(--ds-color-surface);box-shadow:var(--ds-shadow-control);font-size:13px;font-weight:600;white-space:nowrap;cursor:pointer;transition:background .12s,border-color .12s}
.btn:hover{background:var(--ds-color-surface-hover);border-color:var(--ds-color-text-muted)}
.btn.pri{background:var(--ds-color-primary);border-color:transparent;color:var(--ds-color-on-primary);box-shadow:none}
.btn.pri:hover{background:var(--ds-color-primary-hover)}
.btn.gh{background:transparent;border-color:transparent;box-shadow:none}
.btn.gh:hover{background:var(--ds-color-surface-hover)}
.btn.dng{color:var(--ds-color-danger);border-color:color-mix(in srgb,var(--ds-color-danger) 35%,var(--ds-color-border))}
.btn.dng:hover{background:var(--ds-color-danger-subtle)}
.btn.xs{height:26px;padding:0 8px;font-size:12px;box-shadow:none}
.btn:disabled{opacity:.5;cursor:not-allowed}
.ib{display:inline-grid;place-items:center;width:26px;height:26px;border:0;border-radius:var(--ds-radius-sm);background:transparent;color:var(--ds-color-text-muted);cursor:pointer}
.ib:hover{background:var(--ds-color-surface-pressed);color:var(--ds-color-text)}

/* Franja de métricas */
.stats{display:flex;flex:none;border:1px solid var(--ds-color-border);border-radius:var(--ds-radius-md);background:var(--ds-color-surface);overflow:hidden}
.stat{display:flex;align-items:baseline;gap:8px;padding:8px 16px;border:0;border-right:1px solid var(--ds-color-border-subtle);background:none;text-align:left;cursor:pointer;min-width:0;white-space:nowrap}
.stat:last-child{border-right:0;margin-left:auto;cursor:default}
.stat:hover:not(.static){background:var(--ds-color-surface-hover)}
.stat .k{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ds-color-text-faint)}
.stat .v{font:700 20px/1 var(--ds-font-sans);font-variant-numeric:tabular-nums}
.stat .d{font-size:12px;color:var(--ds-color-text-muted)}
.stat.warn .v{color:var(--ds-color-warning)}
.stat.on{box-shadow:inset 0 -2px 0 var(--ds-color-primary)}
.bar{display:inline-block;width:64px;height:6px;border-radius:3px;background:var(--ds-color-surface-pressed);overflow:hidden;align-self:center}
.bar i{display:block;height:100%;background:var(--ds-color-warning)}

/* Tabs */
.tabs{display:flex;flex:none;gap:2px;margin-top:10px;border-bottom:1px solid var(--ds-color-border)}
.tab{position:relative;display:flex;align-items:center;gap:7px;height:36px;padding:0 14px;border:0;background:none;color:var(--ds-color-text-muted);font-size:13.5px;font-weight:600;cursor:pointer}
.tab:hover{color:var(--ds-color-text)}
.tab[aria-selected=true]{color:var(--ds-color-primary)}
.tab[aria-selected=true]::after{content:"";position:absolute;left:8px;right:8px;bottom:-1px;height:2px;background:var(--ds-color-primary)}
.cnt{min-width:20px;padding:1px 6px;border-radius:999px;background:var(--ds-color-surface-muted);color:var(--ds-color-text-muted);font-size:11px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.tab[aria-selected=true] .cnt{background:var(--ds-color-primary-soft);color:var(--ds-color-primary)}
.tab .cnt.w{background:var(--ds-color-warning-subtle);color:var(--ds-color-warning)}

/* Toolbar */
.tb{display:flex;flex:none;align-items:center;gap:8px;padding:10px 0;white-space:nowrap}
.search{position:relative;display:flex;align-items:center}
.search .ic{position:absolute;left:9px;color:var(--ds-color-text-faint)}
.in,.sel{height:30px;border:1px solid var(--ds-color-border-strong);border-radius:var(--ds-radius-md);background:var(--ds-color-surface);padding:0 10px;font-size:13px}
.in::placeholder{color:var(--ds-color-text-faint)}
.search .in{width:260px;padding-left:30px;padding-right:30px}
.kbd{position:absolute;right:7px;padding:0 5px;border:1px solid var(--ds-color-border);border-radius:3px;background:var(--ds-color-surface-muted);font-size:11px;color:var(--ds-color-text-muted);line-height:16px}
.sel{padding-right:6px;cursor:pointer;max-width:200px}
.sel.xs{height:26px;font-size:12.5px;padding:0 4px}
.chip-t{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border:1px solid var(--ds-color-border-strong);border-radius:var(--ds-radius-md);background:var(--ds-color-surface);font-size:13px;font-weight:600;cursor:pointer}
.chip-t[aria-pressed=true]{background:var(--ds-color-warning-subtle);border-color:color-mix(in srgb,var(--ds-color-warning) 40%,var(--ds-color-border));color:var(--ds-color-warning)}
.seg{display:inline-flex;border:1px solid var(--ds-color-border-strong);border-radius:var(--ds-radius-md);overflow:hidden;background:var(--ds-color-surface)}
.seg button{height:28px;padding:0 9px;border:0;border-right:1px solid var(--ds-color-border-subtle);background:none;font-size:12px;font-weight:600;color:var(--ds-color-text-muted);cursor:pointer}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--ds-color-primary-soft);color:var(--ds-color-primary)}
.tb .sp{flex:1}
.res{font-size:12px;color:var(--ds-color-text-muted);font-variant-numeric:tabular-nums}

/* Alerta de coherencia */
.alert{display:flex;flex:none;align-items:center;gap:10px;margin-bottom:10px;padding:6px 12px;border:1px solid color-mix(in srgb,var(--ds-color-warning) 28%,var(--ds-color-border));border-radius:var(--ds-radius-md);background:var(--ds-color-warning-subtle);color:var(--ds-color-warning);font-size:13px}
.alert b{font-weight:700}.alert .btn{margin-left:auto}
.alert.ok{border-color:color-mix(in srgb,var(--ds-color-success) 25%,var(--ds-color-border));background:var(--ds-color-success-subtle);color:var(--ds-color-success)}

/* Área de trabajo */
.work{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr);gap:14px;padding-bottom:14px}
.work.has-i{grid-template-columns:minmax(0,1fr) 380px}
.tw{display:flex;flex-direction:column;min-height:0;border:1px solid var(--ds-color-border);border-radius:var(--ds-radius-md);background:var(--ds-color-surface);box-shadow:var(--ds-shadow-control);overflow:hidden}
.ts{flex:1;min-height:0;overflow:auto;scrollbar-color:var(--ds-color-border-strong) var(--ds-color-surface-muted)}
table{width:100%;border-collapse:collapse;font-size:13px;line-height:1.35;font-variant-numeric:tabular-nums}
thead th{position:sticky;top:0;z-index:2;height:30px;padding:0 12px;background:var(--ds-color-surface-muted);border-bottom:1px solid var(--ds-color-border-strong);color:var(--ds-color-text-muted);font-weight:600;font-size:12px;text-align:left;white-space:nowrap;user-select:none}
thead th.s{cursor:pointer}thead th.s:hover{color:var(--ds-color-text)}
thead th .ar{margin-left:4px;color:var(--ds-color-primary)}
tbody td{height:var(--rh);padding:0 12px;border-bottom:1px solid var(--ds-color-border-subtle);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:320px}
tbody tr{cursor:pointer;transition:background .12s}
tbody tr:hover{background:var(--ds-color-surface-hover)}
tbody tr.sel{background:var(--ds-color-selected);box-shadow:inset 3px 0 0 var(--ds-color-primary)}
tbody tr.off td{color:var(--ds-color-text-faint)}
tbody tr.flash{animation:fl 1.6s}
@keyframes fl{0%,40%{background:var(--ds-color-focus-subtle)}}
td.r,th.r{text-align:right}
td.code{font-weight:700;letter-spacing:.01em}
td.ra{width:1%;padding:0 6px;text-align:right}
td.ra .ib,td.ra .btn{opacity:0}
tr:hover td.ra .ib,tr.sel td.ra .ib,tr:hover td.ra .btn,tr.sel td.ra .btn,td.ra:focus-within .ib{opacity:1}
td.pin{opacity:1}
.has-i .lo{display:none}
[data-pg=catalogos] .has-i tbody td{max-width:190px}
[data-pg=catalogos] .has-i .cc .chip{display:none}
[data-pg=catalogos] .has-i td.code{max-width:none}
[data-pg=catalogos] .has-i .ra{display:none}
table.fx{table-layout:fixed}
table.fx td{max-width:none}
.fx .sel.xs{width:100%;max-width:170px}
.cc{display:inline-flex;align-items:center;gap:6px;vertical-align:middle;max-width:100%}
.chip{display:inline-block;padding:0 6px;border:1px solid var(--ds-color-border-subtle);border-radius:var(--ds-radius-sm);background:var(--ds-color-surface-muted);color:var(--ds-color-text-muted);font-size:11px;line-height:17px;font-weight:600;letter-spacing:.02em}
.bd{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 8px;border:1px solid transparent;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
.bd::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.72}
.bd.ok{color:var(--ds-color-success);background:var(--ds-color-success-subtle);border-color:color-mix(in srgb,var(--ds-color-success) 18%,transparent)}
.bd.warn{color:var(--ds-color-warning);background:color-mix(in srgb,var(--ds-color-warning) 10%,var(--ds-color-surface));border-color:color-mix(in srgb,var(--ds-color-warning) 22%,transparent)}

const visibleCat=()=>{
  const t=st.tab.catalogos,q=norm(st.q),f=st.f;
  let rows=D[t].filter(x=>(!f.jur||x.jur===f.jur)&&(!f.origin||x.origin===f.origin)&&(!f.state||(f.state==='on')===x.on)&&(!f.alerts||(t==='reg'&&!coherent(x))));

  return rows;
};

    <label class="fd"><span>Jurisdicción</span><select class="sel" id="fJ">${jurOpts(x&&x.jur)}</select></label>
    <label class="fd full"><span>Organismo recaudador</span><select class="sel" id="fAuth"></select><small>Sólo se listan organismos de la jurisdicción elegida.</small></label></div><div id="fChk"></div>`;
  if(t==='act')f=`<div class="fg">${code_}${name_}<label class="fd full"><span>Jurisdicción</span><select class="sel" id="fJ">${jurOpts(x&&x.jur)}</select></label>

    if(m==='one'){
      $('#dBody').innerHTML=`<div class="fg"><label class="fd"><span>Nombre</span><input class="in" id="fN" placeholder="Nombre y apellido"></label><label class="fd"><span>Email</span><input class="in" id="fE" type="email" placeholder="persona@estudio.com"></label></div>
      <div class="fd" style="margin-top:12px"><span>Rol interno</span><div class="roles" id="roles">${ROLES.map((r,i)=>`<label class="rr ${i===2?'on':''}"><input type="radio" name="rol" value="${r[0]}" ${i===2?'checked':''}><span><b>${r[1]}</b> <small>· ${ROLE_MODS[r[0]].filter(Boolean).length} de ${MODS.length} módulos</small></span><span>${fpHtml(r[0]).split('</span>')[0]}</span></span></label>`).join('')}</div><small id="rolMods" class="mut"></small></div>`;
      const upd=()=>{const v=$('input[name=rol]:checked').value;$$('.rr').forEach(r=>r.classList.toggle('on',r.querySelector('input').checked));$('#rolMods').textContent=ROLE_MODS[v].map((y,i)=>y?MODS[i]:'').filter(Boolean).join(' · ')};$$('input[name=rol]').forEach(i=>i.onchange=upd);upd();
      $('#dFoot').innerHTML=`<button class="btn gh l" id="dCancel">Cancelar</button><button class="btn pri" id="dOk">${ic('plus')}Crear usuario</button>`;
      $('#dCancel').onclick=closeDrawer;
      $('#dOk').onclick=()=>{const n=$('#fN').value.trim(),e=$('#fE').value.trim();if(!n||!/.+@.+\..+/.test(e)){toast('Ingresá nombre y un email válido');return}
        const u={id:Date.now(),name:n,email:e,role:$('input[name=rol]:checked').value,st:'ACTIVE',_new:1},pw=genPwd();U.int.unshift(u);st.sel=u.id;
        $('#dBody').innerHTML=`<div class="okbox" role="status"><b>Cuenta creada para ${esc(e)}.</b><br>Entregá esta contraseña temporal ahora: no vuelve a mostrarse.<div class="pw"><input class="in" readonly value="${pw}" aria-label="Contraseña temporal"><button class="btn" data-toast="Contraseña copiada">${ic('copy')}Copiar</button></div></div>`;
        $('#dFoot').innerHTML=`<button class="btn gh l" id="dMore">Crear otro</button><button class="btn pri" id="dDone">Terminar</button>`;
        $('#dMore').onclick=()=>{drawPage();paint('one')};$('#dDone').onclick=()=>{closeDrawer();drawPage()};$$('[data-toast]',$('#dBody')).forEach(b=>b.onclick=()=>toast(b.dataset.toast))};
      setTimeout(()=>$('#fN')&&$('#fN').focus(),60);
    }else{
      $('#dBody').innerHTML=`<label class="fd"><span>Pegá una persona por línea: <code>nombre, email, rol</code></span><textarea class="in" id="fB" rows="6" placeholder="Lucía Fernández, lucia@estudio.com, Preparador\nMartín Acosta, martin@estudio.com, Revisor\nCarolina Díaz, caro@estudio.com">Lucía Fernández, lucia@estudio.com, Preparador\nMartín Acosta, martin@estudio.com, Revisor\nCarolina Díaz, caro@estudio\nSebastián Ruiz, sruiz@estudio.com, Auditor</textarea><small>Si falta el rol se asigna <b>Preparador</b>. Podés cambiarlo después desde la tabla.</small></label><div id="pv"></div>`;
      const parse=()=>$('#fB').value.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const [n,e,r]=l.split(',').map(s=>(s||'').trim());const role=(ROLES.find(x=>norm(x[1]).startsWith(norm(r||'preparador').slice(0,4)))||ROLES[2])[0];const ok=!!n&&/.+@.+\..+/.test(e||'');return{n,e,role,ok,l}});
      const draw=()=>{const rows=parse(),ok=rows.filter(r=>r.ok).length;$('#pv').innerHTML=`<div class="pv"><div class="h"><span></span><span>Nombre</span><span>Email</span><span>Rol</span></div>${rows.map(r=>`<div class="${r.ok?'':'bad'}"><span>${r.ok?`<span style="color:var(--ds-color-success)">${ic('check')}</span>`:`<span style="color:var(--ds-color-warning)">${ic('alert')}</span>`}</span><span>${esc(r.n||'—')}</span><span>${esc(r.e||'falta email')}</span><span>${r.ok?rl(r.role):'No se creará'}</span></div>`).join('')}</div>`;$('#dOk').disabled=!ok;$('#dOk').lastChild.textContent=` Crear ${ok} usuario${ok===1?'':'s'}`};
      $('#dFoot').innerHTML=`<span class="mut l" style="font-size:12px;align-self:center">Se generará una contraseña temporal por cuenta, descargable en CSV.</span><button class="btn gh" id="dCancel">Cancelar</button><button class="btn pri" id="dOk">${ic('plus')} Crear</button>`;
      $('#dCancel').onclick=closeDrawer;$('#fB').oninput=draw;
      $('#dOk').onclick=()=>{const rows=parse().filter(r=>r.ok);rows.forEach(r=>U.int.unshift({id:Math.random(),name:r.n,email:r.e,role:r.role,st:'ACTIVE',_new:1}));closeDrawer();drawPage();toast(`${rows.length} usuarios creados · contraseñas temporales en CSV`)};
      draw();
    }
  };
  $$('[data-m]').forEach(b=>b.onclick=()=>paint(b.dataset.m));paint(mode==='batch'?'batch':'one');
}

/* ════════════ Drawer genérico / toast / notas ════════════ */
let lastFocus=null;
function showDrawer({wide,eyebrow,title,desc,body,foot}){
  lastFocus=document.activeElement;const d=$('#drawer');d.classList.toggle('wide',!!wide);
  d.innerHTML=`<div class="dh"><div class="eyebrow">${eyebrow}</div><h2 id="dTitle">${title}</h2><p>${desc}</p><button class="ib" id="dX" aria-label="Cerrar">${ic('x')}</button></div><div class="db">${body}</div><div class="df">${foot}</div>`;
  d.classList.add('on');$('#scrim').classList.add('on');$('#dX').onclick=closeDrawer;
}
function closeDrawer(){$('#drawer').classList.remove('on');$('#scrim').classList.remove('on');if(lastFocus&&lastFocus.focus)try{lastFocus.focus()}catch(e){}}
$('#scrim').onclick=closeDrawer;
let tt;function toast(msg,undo){const t=$('#toast');t.innerHTML=`<span>${esc(msg)}</span>${undo?'<button id="tU">Deshacer</button>':''}`;t.classList.add('on');if(undo)$('#tU').onclick=()=>{undo();t.classList.remove('on')};clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),4200)}

function drawNotes(){
  const ts=$('#ts'),h=ts?ts.clientHeight:0,rows=Math.max(0,Math.floor((h-30)/st.rh));
  $('#notes').innerHTML=`<h2>Notas del mockup</h2><span class="mut">Maqueta navegable con datos reales de la base local (catálogos) y de ejemplo (portal, normas, usuarios extra). Los controles funcionan; nada se guarda.</span>
  <h3>Medición · viewport ${innerWidth}×${innerHeight}</h3>
  <table><thead><tr><th></th><th>Hoy</th><th>Mockup</th></tr></thead><tbody>
   <tr><td>Alto de fila · catálogos</td><td>40 px</td><td class="gain">${st.rh} px (28–40 ajustable)</td></tr>
   <tr><td>Alto de fila · usuarios</td><td>80 px</td><td class="gain">${st.rh} px</td></tr>
   <tr><td>Filas visibles sin scroll</td><td>≈9 (catálogos) · 0–1 (usuarios)</td><td class="gain">${rows} en esta vista</td></tr>
   <tr><td>Scroll de página · catálogos</td><td>2.589 px, 3 tablas apiladas</td><td class="gain">0 px; tabla con scroll interno</td></tr>
   <tr><td>Scroll de página · usuarios</td><td>1.848 px, 4 bloques</td><td class="gain">0 px</td></tr>
   <tr><td>Texto explicativo antes de la tabla</td><td>≈6 párrafos</td><td class="gain">1 línea + pie de tabla</td></tr></tbody></table>
  <h3>Qué cambia</h3><ul>
   <li><b>Una vista, no una columna de secciones.</b> Pestañas con conteo reemplazan las tablas apiladas; “Resumen” y “Próximo paso” se funden en una franja de métricas clicables.</li>
   <li><b>Master-detail.</b> Al elegir una fila se abre un panel de detalle a la derecha y se ocultan columnas secundarias (Origen, Estado) en vez de empujar la tabla.</li>
   <li><b>Altas y ediciones en drawer</b>, como exige la guía UI, pero más compacto: grilla de 2 columnas, validación de coherencia en vivo y alta <i>en lote</i> para usuarios.</li>
   <li><b>Matriz rol × módulo</b> reemplaza repetir la lista de módulos en cada fila (huella de 7 barras + detalle).</li>
   <li><b>Estado de calidad visible:</b> columna Origen (Base / Sintético / Estudio), filtro por sintéticos y alerta de coherencia régimen ↔ organismo.</li>
   <li><b>Teclado:</b> <kbd>/</kbd> buscar, <kbd>↑↓</kbd> navegar, <kbd>↵</kbd> abrir, <kbd>N</kbd> nuevo, <kbd>Esc</kbd> cerrar. Cambio de rol y suspensión con “Deshacer” en lugar de modales.</li></ul>
  <h3>Requiere decisión o backend</h3><ul>
   <li><span class="dot"></span>Columnas/valores propuestos que hoy no existen: <b>Origen</b> (hoy se infiere por nombre), <b>Regímenes por organismo</b>, <b>Historial reciente</b>, alta en lote con CSV de contraseñas.</li>
   <li>El filtro “Coherencia” usa la regla ya declarada en el formulario (organismo ↔ jurisdicción); en los datos locales marca <b>IIBB_LOCAL_TUC</b> y <b>TEM_SMT</b>.</li>
   <li>Cambio de rol con “Deshacer” reemplaza la confirmación actual: validar con quien defina el flujo de titularidad.</li></ul>`;
}
$('#btnNotes').onclick=()=>{drawNotes();$('#notes').classList.toggle('on')};

/* ════════════ Página + teclado ════════════ */
function drawPage(){
  $('#page').dataset.pg=st.page;
  $('#page').innerHTML=st.page==='catalogos'?pageCat():pageUsers();
  document.documentElement.style.setProperty('--rh',st.rh+'px');
  st.page==='catalogos'?bindCat():bindUsers();
  if($('#notes').classList.contains('on'))drawNotes();
}
document.addEventListener('keydown',e=>{
  const tag=(e.target.tagName||'').toLowerCase(),typing=['input','textarea','select'].includes(tag);
  if(e.key==='Escape'){if($('#drawer').classList.contains('on'))closeDrawer();else if(st.sel){st.sel=null;st.rec=false;st.page==='catalogos'?(drawTable(),drawInspCat()):(drawUsers(),drawInspUsers())}else $('#notes').classList.remove('on');return}
  if(typing||$('#drawer').classList.contains('on'))return;
  if(e.key==='/'){e.preventDefault();$('#q').focus()}
  else if(e.key==='n'||e.key==='N'){e.preventDefault();$('#btnNew').click()}
  else if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    const ids=$$('#ts tbody tr[data-id]').map(r=>r.dataset.id);if(!ids.length)return;e.preventDefault();
    let i=ids.indexOf(String(st.sel));i=e.key==='ArrowDown'?Math.min(ids.length-1,i+1):Math.max(0,i<0?0:i-1);st.sel=ids[i];
    if(st.page==='catalogos'){drawTable();drawInspCat()}else{drawUsers();drawInspUsers()}
    const r=$(`#ts tr[data-id="${CSS.escape(String(st.sel))}"]`);if(r)r.scrollIntoView({block:'nearest'});
  }
});
window.addEventListener('resize',()=>{if($('#notes').classList.contains('on'))drawNotes()});
/* El estudio de ejemplo arranca cargado para evaluar la densidad; se puede quitar desde la barra de herramientas. */
SAMPLE_USERS.forEach((n,i)=>U.int.push({id:100+i,name:n,email:norm(n).replace(/ /g,'.')+'@estudio-demo.example',role:['PREPARER','PREPARER','REVIEWER','ADMIN','AUDITOR_READONLY'][i%5],st:i===7||i===15?'SUSPENDED':'ACTIVE'}));
drawNav();drawPage();
</script>
