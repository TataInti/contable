# ============================================================
# Contable — Nginx de PRODUCCIÓN (TLS + hardening)
#
# - Redirige HTTP a HTTPS.
# - Certificado renovado por ACME (Let's Encrypt) vía webroot.
# - HSTS sólo cuando el dominio productivo y TLS estén validados
#   (activar manualmente cambiando la directiva a 31536000).
# - CSP restrictiva y headers de seguridad.
# - Rate limit por IP en login, MFA, refresh, uploads y SSE.
# - PUT a objetos sólo por URL prefirmada y buckets explícitos.
# - Fallback de BrowserRouter para la SPA; las rutas /api desconocidas
#   conservan 404/410 (nunca se convierten en index.html).
# ============================================================

# Límites de request por IP (zona compartida).
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=upload:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=sse:10m rate=30r/m;

server {
    listen 80;
    server_name ${DOMAIN};

    # ACME challenge (Let's Encrypt) por webroot.
    location /.well-known/acme-challenge/ {
        root /var/www/challenges;
    }

    # Todo lo demás en HTTP redirige a HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name ${DOMAIN};

    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # HSTS: activar a 31536000 sólo cuando el dominio y TLS estén validados.
    add_header Strict-Transport-Security "max-age=0; includeSubDomains" always;

    # Headers de seguridad.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: fallback de BrowserRouter. Sólo para rutas sin extensión de archivo.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|woff2)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API de negocio.
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # SSE autenticado (F0.7/F2): sin buffering, timeout prolongado, sin cache.
    location /api/v1/events {
        limit_req zone=sse burst=5 nodelay;
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Login/MFA/refresh con rate limit estricto.
    location ~ ^/api/v1/auth/(login|mfa/verify|refresh)$ {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Uploads: límite de tamaño y rate limit.
    location ~ ^/api/v1/.*/document-upload-sessions/.*/complete$ {
        limit_req zone=upload burst=3 nodelay;
        client_max_body_size 25m;
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Proxy same-origin para URLs prefirmadas de MinIO. Se preserva el Host
    # porque forma parte de AWS Signature V4; sólo se exponen buckets previstos.
    location ~ ^/(?:quarantine|originals|derived|exports)/ {
        client_max_body_size 25m;
        limit_except GET HEAD PUT { deny all; }
        proxy_pass http://minio:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_request_buffering off;
        proxy_buffering off;
    }
}