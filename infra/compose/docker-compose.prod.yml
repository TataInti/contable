# ============================================================
# Contable — Compose de PRODUCCIÓN (autoalojado)
#
# Diferencias clave con docker-compose.yml (desarrollo):
#  - El Nginx del host es la entrada pública (80/443). Docker sólo
#    publica el frontend en 127.0.0.1:18080; PostgreSQL, Valkey,
#    MinIO, ClamAV, API, worker y FastAPI quedan en la red privada.
#  - No hay secretos por defecto: TODAS las credenciales se leen
#    de variables de entorno obligatorias. Si faltan, el servicio
#    no arranca (validación estricta en la API/worker/IA).
#  - Imágenes fijadas por digest (no `latest` ni `stable` flotantes).
#  - Volúmenes explícitos para PostgreSQL, MinIO y la base de firmas de ClamAV.
#  - restart: unless-stopped y healthchecks que bloquean dependientes.
#
# Uso: docker compose -f infra/compose/docker-compose.prod.yml up
# Requiere definir en el entorno: POSTGRES_PASSWORD, RUNTIME_DB_PASSWORD,
# WORKER_DB_PASSWORD, MINIO_SECRET_KEY, AI_SERVICE_SECRET,
# MFA_CHALLENGE_SECRET, MFA_ENCRYPTION_KEY y PUBLIC_HOSTNAME.
# TLS y certificados se configuran en el Nginx del host.
# ============================================================

name: contable-prod

services:
  postgres:
    image: postgres:18@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    # F2.6: hardening — sin privilegios nuevos, capacidades mínimas, root fs readonly.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    read_only: true
    tmpfs:
      - /var/run/postgresql
      - /tmp
    environment:
      POSTGRES_USER: contable
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatorio}
      POSTGRES_DB: contable
      RUNTIME_DB_PASSWORD: ${RUNTIME_DB_PASSWORD:?RUNTIME_DB_PASSWORD es obligatorio}
      WORKER_DB_PASSWORD: ${WORKER_DB_PASSWORD:?WORKER_DB_PASSWORD es obligatorio}
    volumes:
      - pgdata:/var/lib/postgresql
      - ../postgres/init-roles.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contable"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: contable
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY es obligatorio}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8-alpine@sha256:d2e18f3410b6f616de1417f570fa55261af2898b9c5b2cfb6781ce2373ea43d1
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  clamav:
    image: clamav/clamav-debian@sha256:4c975c439fcb7ab9cbdd72162c2802f5efcb4a11dcf5b0b37da1d746474ef20e
    volumes:
      - clamdb:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "1"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  migrate:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://contable:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatorio}@postgres:5432/contable?schema=public
    command: ["npx", "prisma", "migrate", "deploy", "--config", "apps/api/prisma.config.ts"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    # F2.6: hardening — sin privilegios, capacidades mínimas.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: postgresql://contable_runtime:${RUNTIME_DB_PASSWORD:?RUNTIME_DB_PASSWORD es obligatorio}@postgres:5432/contable?schema=public
      RUNTIME_DATABASE_URL: postgresql://contable_runtime:${RUNTIME_DB_PASSWORD:?RUNTIME_DB_PASSWORD es obligatorio}@postgres:5432/contable?schema=public
      REDIS_URL: redis://valkey:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_PUBLIC_ENDPOINT: ${PUBLIC_HOSTNAME:?PUBLIC_HOSTNAME es obligatorio}
      MINIO_PUBLIC_PORT: 443
      MINIO_PUBLIC_USE_SSL: "true"
      MINIO_ACCESS_KEY: contable
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY es obligatorio}
      AI_SERVICE_URL: http://ai:8000
      AI_SERVICE_SECRET: ${AI_SERVICE_SECRET:?AI_SERVICE_SECRET es obligatorio}
      MFA_CHALLENGE_SECRET: ${MFA_CHALLENGE_SECRET:?MFA_CHALLENGE_SECRET es obligatorio}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?MFA_ENCRYPTION_KEY es obligatorio}
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
      minio:
        condition: service_healthy
      ai:
        condition: service_started
    restart: unless-stopped

  worker:
    build:
      context: ../..
      dockerfile: apps/worker/Dockerfile
    # F2.6: hardening.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    environment:
      NODE_ENV: production
      WORKER_DATABASE_URL: postgresql://contable_worker:${WORKER_DB_PASSWORD:?WORKER_DB_PASSWORD es obligatorio}@postgres:5432/contable?schema=public
      REDIS_URL: redis://valkey:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: contable
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY es obligatorio}
      AI_SERVICE_URL: http://ai:8000
      AI_SERVICE_SECRET: ${AI_SERVICE_SECRET:?AI_SERVICE_SECRET es obligatorio}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      WORKER_QUEUES: documents,notifications
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
      minio:
        condition: service_healthy
      clamav:
        condition: service_healthy
    restart: unless-stopped

  ai:
    build:
      context: ../..
      dockerfile: services/ai/Dockerfile
    environment:
      NODE_ENV: production
      AI_SERVICE_SECRET: ${AI_SERVICE_SECRET:?AI_SERVICE_SECRET es obligatorio}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      EXTRACTION_ENGINE: ${EXTRACTION_ENGINE:-model}
      EXTRACTION_MODEL: ${EXTRACTION_MODEL:-anthropic/claude-haiku-5.5}
      EXTRACTION_CUSTOMER_DATA_ENABLED: ${EXTRACTION_CUSTOMER_DATA_ENABLED:-false}
    depends_on:
      - valkey
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    depends_on:
      - api
    ports:
      - "127.0.0.1:18080:8080"
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
  clamdb:
